AWSTemplateFormatVersion: "2010-09-09"
Description: Claude Code UI — Secrets Manager entries

Resources:
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/jwt-secret
      Description: JWT signing secret for Claude Code UI session tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  CsrfSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/csrf-secret
      Description: CSRF protection secret for Claude Code UI
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ChiselAuth:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/chisel-auth
      Description: Chisel tunnel AUTH credential (user:password format)
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  MtlsCaCert:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/mtls-ca-cert
      Description: mTLS CA certificate (PEM). Used by chisel server for client verification.
      SecretString: "PLACEHOLDER - replace with PEM certificate after generating certs"

  MtlsServerCert:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/mtls-server-cert
      Description: mTLS server certificate (PEM) for chisel tunnel server.
      SecretString: "PLACEHOLDER - replace with PEM certificate after generating certs"

  MtlsServerKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/mtls-server-key
      Description: mTLS server private key (PEM) for chisel tunnel server.
      SecretString: "PLACEHOLDER - replace with PEM key after generating certs"

  GithubDeployKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui/github-deploy-key
      Description: >-
        Read-only GitHub deploy key (SSH private key) for cloning the
        claudecodeui repo during instance bootstrap.
      SecretString: "PLACEHOLDER - replace with SSH private key"

  MtlsCaKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: claudeui-ca/mtls-ca-key
      Description: >-
        mTLS Certificate Authority private key. Stored under claudeui-ca/
        prefix so the EC2 instance role (which only has access to claudeui/*)
        cannot read it. Human operator access only.
