AWSTemplateFormatVersion: "2010-09-09"
Description: Claude Code UI — EC2 with Chisel + mTLS, ALB + ACM for TLS

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Primary subnet (EC2 instance)
  SubnetBId:
    Type: AWS::EC2::Subnet::Id
    Description: Second subnet (different AZ, required for ALB)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      Route53 Hosted Zone ID for DNS records and ACM validation. Find with:
      aws route53 list-hosted-zones-by-name --dns-name superlinear.com
      --query 'HostedZones[0].Id' --output text | sed 's|/hostedzone/||'
  InstanceType:
    Type: String
    Default: t4g.small
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM parameter path for the AMI (resolves to latest AL2023 ARM64 at deploy time)
  KeyName:
    Type: String
    Default: claudeui-ec2-key
    Description: Name for the EC2 key pair (created by this stack; private key stored in SSM Parameter Store)
  DomainName:
    Type: String
    Default: agents.superlinear.com
    Description: User-facing domain (tunnel subdomain derived automatically)
  AdminCidr:
    Type: String
    Description: CIDR for SSH access (e.g., 203.0.113.5/32). Restrict to operator IP.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  ChiselVersion:
    Type: String
    Default: "1.10.1"
  ForceInstanceRebuild:
    Type: String
    Default: "1"
    Description: Increment to force instance replacement (triggers UserData re-run)
  RepoUrl:
    Type: String
    Default: "git@github.com:luchoh/claudecodeui.git"
    Description: Git SSH URL for cloning the app repo
  RepoBranch:
    Type: String
    Default: main
    Description: Git branch to build and deploy

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Ref KeyName
      KeyType: ed25519
      Tags:
        - Key: Name
          Value: !Ref KeyName

  # --- Security Groups ---

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Claude Code UI ALB - public HTTP/HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: claudeui-alb-sg

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Claude Code UI EC2 - HTTP from ALB, chisel + SSH direct
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # HTTP from ALB only (TLS terminated at ALB)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Chisel tunnel (mTLS is the access gate)
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0
        # SSH (admin access — restrict to your IP)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # --- ACM Certificate ---

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # --- ALB ---

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: claudeui-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref SubnetId
        - !Ref SubnetBId
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
      Tags:
        - Key: Name
          Value: claudeui-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: claudeui-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      Targets:
        - Id: !Ref Instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref Certificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # --- IAM ---

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: secrets-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:claudeui/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- EC2 ---

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 25
            VolumeType: gp3
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: agents-superlinear-ec2
        - Key: ForceRebuild
          Value: !Ref ForceInstanceRebuild
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # System updates
          # NOTE: Amazon Linux 2023 ships with awscli v2 and curl preinstalled
          # Ref: https://docs.aws.amazon.com/linux/al2023/ug/compare-with-al2.html
          dnf update -y
          dnf install -y nginx git nodejs22 nodejs22-npm jq nmap-ncat gcc-c++ make

          # Create service users
          useradd --system --no-create-home --shell /usr/sbin/nologin chisel

          # Install chisel
          curl -L "https://github.com/jpillora/chisel/releases/download/v${ChiselVersion}/chisel_${ChiselVersion}_linux_arm64.gz" \
            | gunzip > /usr/local/bin/chisel
          chmod +x /usr/local/bin/chisel

          # Create directories
          mkdir -p /etc/chisel/certs /var/log/chisel /var/lib/claudeui /var/www/claudeui
          chown chisel:chisel /var/log/chisel

          # --- Secrets from Secrets Manager ---
          # Suppress trace to avoid printing secrets in cloud-init logs
          set +x
          CHISEL_AUTH=$(aws secretsmanager get-secret-value \
            --region ${AWS::Region} \
            --secret-id claudeui/chisel-auth \
            --query SecretString --output text)
          echo "AUTH=$CHISEL_AUTH" > /etc/chisel/env
          chmod 600 /etc/chisel/env
          set -x

          # --- Chisel systemd service ---
          cat > /etc/systemd/system/chisel-server.service << 'UNIT'
          [Unit]
          Description=Chisel Tunnel Server
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=chisel
          Group=chisel
          EnvironmentFile=/etc/chisel/env
          ExecStart=/usr/local/bin/chisel server --port 8443 --reverse --tls-key /etc/chisel/certs/server.key --tls-cert /etc/chisel/certs/server.crt --tls-ca /etc/chisel/certs/ca.crt
          Restart=always
          RestartSec=5
          LimitNOFILE=65535
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=true
          ReadWritePaths=/var/log/chisel
          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload

          # --- mTLS certificates from Secrets Manager ---
          set +x  # Suppress trace for secrets
          CA_CERT=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id claudeui/mtls-ca-cert --query SecretString --output text 2>/dev/null || echo "")
          SERVER_CERT=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id claudeui/mtls-server-cert --query SecretString --output text 2>/dev/null || echo "")
          SERVER_KEY=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id claudeui/mtls-server-key --query SecretString --output text 2>/dev/null || echo "")

          if echo "$CA_CERT" | grep -q "BEGIN CERTIFICATE" && \
             echo "$SERVER_CERT" | grep -q "BEGIN CERTIFICATE" && \
             echo "$SERVER_KEY" | grep -q "BEGIN"; then
            echo "$CA_CERT" > /etc/chisel/certs/ca.crt
            echo "$SERVER_CERT" > /etc/chisel/certs/server.crt
            echo "$SERVER_KEY" > /etc/chisel/certs/server.key
            set -x
            chown chisel:chisel /etc/chisel/certs/*
            chmod 644 /etc/chisel/certs/ca.crt /etc/chisel/certs/server.crt
            chmod 600 /etc/chisel/certs/server.key
            systemctl enable --now chisel-server
            echo "INFO: chisel-server started with mTLS certs from Secrets Manager"
          else
            set -x
            systemctl enable chisel-server
            echo "WARN: mTLS certs not provisioned yet. Provision secrets and rebuild instance:"
            echo "  claudeui/mtls-ca-cert, claudeui/mtls-server-cert, claudeui/mtls-server-key"
          fi

          # --- Backend registry ---
          mkdir -p /etc/claudeui
          cat > /etc/claudeui/backends.json << 'REGISTRY'
          {
            "backends": [
              {"id": "backend-01", "port": 9001}
            ]
          }
          REGISTRY

          # --- Tunnel health check script + timer ---
          cat > /usr/local/bin/check-tunnels.sh << 'HEALTH_SCRIPT'
          #!/bin/bash
          BACKENDS_JSON="/etc/claudeui/backends.json"
          PORTS=$(jq -r '.backends[].port' "$BACKENDS_JSON")
          for port in $PORTS; do
            if ! nc -z -w 2 localhost $port 2>/dev/null; then
              echo "$(date) WARN: tunnel port $port unreachable" >> /var/log/chisel/health.log
            fi
          done
          HEALTH_SCRIPT
          chmod +x /usr/local/bin/check-tunnels.sh

          cat > /etc/systemd/system/check-tunnels.service << 'TIMER_SVC'
          [Unit]
          Description=Check chisel tunnel health
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/check-tunnels.sh
          TIMER_SVC

          cat > /etc/systemd/system/check-tunnels.timer << 'TIMER_UNIT'
          [Unit]
          Description=Run tunnel health check every 30s
          [Timer]
          OnBootSec=60
          OnUnitActiveSec=30
          [Install]
          WantedBy=timers.target
          TIMER_UNIT

          systemctl daemon-reload
          systemctl enable --now check-tunnels.timer

          # --- Nginx configuration (HTTP-only, TLS terminated at ALB) ---
          # Placeholder page until frontend is built
          mkdir -p /var/www/claudeui/dist
          cat > /var/www/claudeui/dist/index.html << 'PLACEHOLDER'
          <!DOCTYPE html><html><body>
          <h1>Claude Code UI</h1><p>Loading...</p>
          </body></html>
          PLACEHOLDER

          cat > /etc/nginx/conf.d/claudeui.conf << 'NGINX_CONF'
          server {
              listen 80 default_server;
              server_name ${DomainName};
              root /var/www/claudeui/dist;
              index index.html;

              location /health {
                  access_log off;
                  return 200 "ok\n";
                  add_header Content-Type text/plain;
              }

              location /api/ {
                  proxy_pass http://localhost:$backend_port;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  # Use ALB's header, not $scheme (which is always "http" behind ALB)
                  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
              }

              location /ws {
                  proxy_pass http://localhost:$backend_port;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 86400s;
              }

              location /shell {
                  proxy_pass http://localhost:$backend_port;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 86400s;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX_CONF

          cat > /etc/nginx/conf.d/claudeui-backends.conf << 'NGINX_MAP'
          map $cookie_backend $backend_port {
              default     9001;
              backend-01  9001;
          }
          NGINX_MAP

          rm -f /etc/nginx/conf.d/default.conf 2>/dev/null || true
          rm -f /usr/share/nginx/html/index.html 2>/dev/null || true
          systemctl enable --now nginx

          # --- Swap file (t4g.small has 2 GB RAM; vite build needs more) ---
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # --- Frontend build from git (runs after nginx, non-fatal) ---
          set +x  # Suppress trace for deploy key
          DEPLOY_KEY=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
            --secret-id claudeui/github-deploy-key --query SecretString --output text 2>/dev/null || echo "")
          set -x

          if echo "$DEPLOY_KEY" | grep -q "BEGIN"; then
            (
              set +e  # Don't abort script if build fails
              set +x  # Don't echo deploy key to logs
              mkdir -p /root/.ssh
              echo "$DEPLOY_KEY" > /root/.ssh/deploy_key
              chmod 600 /root/.ssh/deploy_key
              cat > /root/.ssh/config << 'SSH_CONFIG'
          Host github.com
            IdentityFile /root/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          SSH_CONFIG
              chmod 600 /root/.ssh/config
              set -x  # Re-enable trace for build commands

              WORK_DIR=$(mktemp -d)
              git clone -b ${RepoBranch} --depth 1 ${RepoUrl} "$WORK_DIR" && \
              cd "$WORK_DIR" && \
              npm ci && \
              npm run build && \
              rm -rf /var/www/claudeui/dist && \
              cp -r "$WORK_DIR/dist" /var/www/claudeui/dist && \
              echo "INFO: Frontend built from ${RepoUrl} (${RepoBranch}) and deployed"

              BUILD_EXIT=$?
              rm -rf "$WORK_DIR" /root/.ssh/deploy_key /root/.ssh/config
              if [ $BUILD_EXIT -ne 0 ]; then
                echo "ERROR: Frontend build failed (exit $BUILD_EXIT). Placeholder page remains."
              fi
            )
          else
            echo "WARN: GitHub deploy key not provisioned. Placeholder page served."
          fi

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

  # --- Route53 ---

  AgentsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

  TunnelRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "tunnel.${DomainName}"
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref ElasticIP

Outputs:
  PublicIP:
    Value: !Ref ElasticIP
    Description: Elastic IP for SSH and chisel tunnel access
  InstanceId:
    Value: !Ref Instance
  KeyPairId:
    Value: !GetAtt KeyPair.KeyPairId
    Description: >-
      EC2 key pair ID. Retrieve the private key with:
      aws ssm get-parameter --name /ec2/keypair/<KeyPairId> --with-decryption --query Parameter.Value --output text
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
    Description: ALB DNS name (agents.superlinear.com aliases to this)
  CertificateArn:
    Value: !Ref Certificate
    Description: ACM certificate ARN
