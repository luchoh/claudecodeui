AWSTemplateFormatVersion: "2010-09-09"
Description: Claude Code UI — EC2 with Chisel + mTLS

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceType:
    Type: String
    Default: t4g.small
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 ARM64 AMI
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  DomainName:
    Type: String
    Default: agents.superlinear.com
    Description: User-facing domain (tunnel subdomain derived automatically)
  AdminCidr:
    Type: String
    Description: CIDR for SSH access (e.g., 203.0.113.5/32). Restrict to operator IP.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  ChiselVersion:
    Type: String
    Default: "1.10.1"

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Claude Code UI EC2
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: secrets-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:claudeui/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroup
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: agents-superlinear-ec2
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # System updates
          # NOTE: Amazon Linux 2023 ships with awscli v2 and curl preinstalled
          # Ref: https://docs.aws.amazon.com/linux/al2023/ug/compare-with-al2.html
          dnf update -y
          dnf install -y nginx git nodejs20 npm jq nmap-ncat

          # Create service users
          useradd --system --no-create-home --shell /usr/sbin/nologin chisel

          # Install chisel
          curl -L "https://github.com/jpillora/chisel/releases/download/v${ChiselVersion}/chisel_${ChiselVersion}_linux_arm64.gz" \
            | gunzip > /usr/local/bin/chisel
          chmod +x /usr/local/bin/chisel

          # Create directories
          mkdir -p /etc/chisel/certs /var/log/chisel /var/lib/claudeui /var/www/claudeui
          chown chisel:chisel /var/log/chisel

          # Fetch secrets from Secrets Manager
          CHISEL_AUTH=$(aws secretsmanager get-secret-value \
            --region ${AWS::Region} \
            --secret-id claudeui/chisel-auth \
            --query SecretString --output text)
          echo "AUTH=$CHISEL_AUTH" > /etc/chisel/env
          chmod 600 /etc/chisel/env

          # Install certbot for Let's Encrypt
          dnf install -y certbot python3-certbot-nginx

          # Chisel systemd service
          cat > /etc/systemd/system/chisel-server.service << 'UNIT'
          [Unit]
          Description=Chisel Tunnel Server
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=chisel
          Group=chisel
          EnvironmentFile=/etc/chisel/env
          ExecStart=/usr/local/bin/chisel server --port 8443 --reverse --tls-key /etc/chisel/certs/server.key --tls-cert /etc/chisel/certs/server.crt --tls-ca /etc/chisel/certs/ca.crt
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          ProtectSystem=strict
          ReadWritePaths=/var/log/chisel
          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable chisel-server

          # NOTE: chisel-server won't start until certs are deployed
          # NOTE: nginx SSL won't work until certbot runs
          # These are manual post-deploy steps (see Section 9)

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

Outputs:
  PublicIP:
    Value: !Ref ElasticIP
  InstanceId:
    Value: !Ref Instance